<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ラジオ体操スタンプラリー</title>
  <style>
    :root {
      --sky: #aee4ff;
      --sky-deep: #6ec6f5;
      --sand: #fff8e7;
      --ink: #2b3a4a;
      --red: #e0402f;
      --red-soft: #f7d2cc;
      --green: #3d9b63;
      --card: #ffffff;
      --line: #dbe7ef;
      --accent: #ff9d2e;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Hiragino Maru Gothic ProN", "BIZ UDGothic", "Yu Gothic", "Noto Sans JP", sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, var(--sky) 0%, #d9f2ff 45%, var(--sand) 100%);
      min-height: 100vh;
      padding: 0 12px 40px;
    }

    .hero { text-align: center; padding: 28px 8px 8px; }

    .sun { font-size: 56px; animation: float 3.5s ease-in-out infinite; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .hero h1 {
      margin: 4px 0 6px;
      font-size: clamp(22px, 4.5vw, 34px);
      letter-spacing: 0.05em;
      text-shadow: 0 2px 0 rgba(255, 255, 255, 0.8);
    }

    .period { margin: 0; font-weight: bold; color: #4a6076; }

    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(43, 58, 74, 0.12);
      max-width: 640px;
      margin: 16px auto;
      padding: 18px 20px;
    }

    .clock-row { display: flex; justify-content: space-between; align-items: baseline; font-weight: bold; }
    .clock { font-size: 26px; font-variant-numeric: tabular-nums; }

    .window-label { margin: 6px 0 14px; color: #4a6076; }
    .window-label .open { color: var(--green); font-weight: bold; }
    .window-label .closed { color: #8a97a3; font-weight: bold; }

    .stamp-form { display: flex; gap: 10px; flex-wrap: wrap; }

    .stamp-form input {
      flex: 1 1 200px;
      font-size: 16px;
      padding: 12px 14px;
      border: 2px solid var(--line);
      border-radius: 10px;
    }

    .stamp-form input:focus { outline: none; border-color: var(--sky-deep); }

    .stamp-btn {
      flex: 1 1 200px;
      font-size: 18px;
      font-weight: bold;
      color: #fff;
      background: linear-gradient(180deg, #ff5a45, var(--red));
      border: none;
      border-radius: 10px;
      padding: 12px 18px;
      cursor: pointer;
      box-shadow: 0 4px 0 #a52d20;
      transition: transform 0.08s, box-shadow 0.08s;
    }

    .stamp-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a52d20; }

    .stamp-btn:disabled {
      background: #b8c4cd;
      box-shadow: 0 4px 0 #93a0aa;
      cursor: not-allowed;
    }

    .message { min-height: 1.4em; margin: 12px 0 0; font-weight: bold; }
    .message.ok { color: var(--green); }
    .message.err { color: var(--red); }

    .rewards { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }

    .rewards li {
      background: var(--sand);
      border: 2px dashed var(--accent);
      border-radius: 999px;
      padding: 6px 14px;
      font-weight: bold;
      font-size: 14px;
    }

    .card h2 { margin: 0 0 12px; font-size: 18px; }

    .board-title { max-width: 1100px; margin: 28px auto 12px; font-size: 20px; }

    .today-count { font-size: 14px; color: #4a6076; margin-left: 8px; }

    .board {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .taiso-card {
      background: var(--sand);
      border: 3px solid var(--red);
      border-radius: 12px;
      padding: 12px 14px 14px;
      position: relative;
      box-shadow: 0 4px 10px rgba(43, 58, 74, 0.12);
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.12s;
    }

    .taiso-card:hover { transform: translateY(-3px); box-shadow: 0 8px 18px rgba(43, 58, 74, 0.2); }

    .taiso-card::before {
      /* 首ひもの穴 */
      content: "";
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 34px;
      height: 12px;
      background: #fff;
      border: 3px solid var(--red);
      border-top: none;
      border-radius: 0 0 20px 20px;
    }

    .taiso-card.me { outline: 4px solid var(--accent); outline-offset: 2px; }

    .taiso-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 2px solid var(--red);
      padding: 6px 2px 6px;
      margin-bottom: 10px;
    }

    .taiso-name { font-size: 18px; font-weight: bold; }

    .taiso-name .me-badge {
      font-size: 11px;
      color: #fff;
      background: var(--accent);
      border-radius: 999px;
      padding: 2px 8px;
      margin-left: 6px;
      vertical-align: middle;
    }

    .taiso-total { font-weight: bold; color: var(--red); white-space: nowrap; }

    .day-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }

    .day {
      aspect-ratio: 1;
      border: 1.5px solid #d9c9a8;
      border-radius: 8px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: #8a97a3;
      position: relative;
      overflow: hidden;
    }

    .day.off { background: #eef2f5; color: #b8c4cd; }
    .day.today { border-color: var(--sky-deep); border-width: 2.5px; }

    .day .num { font-weight: bold; }

    .day.stamped .hanko {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      color: var(--red);
      background: radial-gradient(circle at center, var(--red-soft) 0%, transparent 72%);
      transform: rotate(-8deg);
    }

    .day.stamped .hanko::after {
      content: "";
      position: absolute;
      width: 78%;
      height: 78%;
      border: 2.5px solid var(--red);
      border-radius: 50%;
      opacity: 0.85;
    }

    .day .time { position: absolute; bottom: 1px; font-size: 8px; color: #a52d20; }

    .reward-badges { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }

    .reward-badges span {
      font-size: 12px;
      font-weight: bold;
      background: #fff;
      border: 2px solid var(--green);
      color: var(--green);
      border-radius: 999px;
      padding: 3px 10px;
    }

    .reward-badges span.locked { border-color: var(--line); color: #b8c4cd; filter: grayscale(1); }

    footer { text-align: center; color: #4a6076; margin-top: 36px; font-size: 13px; }

    .stamp-overlay[hidden] { display: none; }

    .stamp-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(43, 58, 74, 0.35);
      z-index: 50;
    }

    .big-stamp {
      width: 180px;
      height: 180px;
      border: 8px solid var(--red);
      border-radius: 50%;
      color: var(--red);
      font-size: 96px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--sand);
      transform: rotate(-10deg);
      animation: slam 0.5s cubic-bezier(0.2, 2.2, 0.4, 1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    @keyframes slam {
      0% { transform: scale(2.6) rotate(-10deg); opacity: 0; }
      60% { transform: scale(0.92) rotate(-10deg); opacity: 1; }
      100% { transform: scale(1) rotate(-10deg); }
    }

    .card-modal[hidden] { display: none; }

    .card-modal {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(43, 58, 74, 0.55);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow-y: auto;
      padding: 24px 12px;
    }

    .card-modal-inner { width: min(640px, 96vw); margin: auto; }

    .card-canvas-wrap img {
      display: block;
      width: 100%;
      border-radius: 18px;
      box-shadow: 0 16px 44px rgba(0, 0, 0, 0.4);
    }

    .card-modal-btns {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 14px;
      flex-wrap: wrap;
    }

    .save-hint { text-align: center; color: #eaf4fb; font-size: 12px; margin-top: 8px; }

    .sub-btn {
      font-size: 15px;
      font-weight: bold;
      color: var(--ink);
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 10px;
      padding: 10px 18px;
      cursor: pointer;
    }

    .sub-btn:hover { border-color: var(--sky-deep); }

    .loading { text-align: center; color: #4a6076; font-weight: bold; padding: 40px 0; }
  </style>
</head>
<body>
  <header class="hero">
    <div class="sun">☀️</div>
    <h1 id="event-name">ラジオ体操スタンプラリー</h1>
    <p id="event-period" class="period"></p>
  </header>

  <div id="loading" class="loading">よみこみ中…</div>

  <div id="main" hidden>
    <section class="card">
      <div class="clock-row">
        <span id="today-label"></span>
        <span id="now-clock" class="clock"></span>
      </div>
      <p id="window-label" class="window-label"></p>

      <div class="stamp-form">
        <input id="name-input" list="name-list" maxlength="20" placeholder="お名前(はじめての人はここで登録)" autocomplete="off">
        <datalist id="name-list"></datalist>
        <button id="stamp-btn" class="stamp-btn">今日のスタンプを押す!</button>
      </div>
      <p id="message" class="message" role="status"></p>
    </section>

    <section class="card">
      <h2>🎁 ごほうびライン</h2>
      <ul id="rewards" class="rewards"></ul>
    </section>

    <section>
      <h2 class="board-title">🌻 みんなのスタンプカード <span id="today-count" class="today-count"></span></h2>
      <div id="board" class="board"></div>
    </section>

    <footer>
      <p>毎朝みんなで集まって、元気にスタートしよう!<br>カードをクリックすると拡大して画像で保存できます。</p>
    </footer>
  </div>

  <div id="stamp-overlay" class="stamp-overlay" hidden>
    <div class="big-stamp">出</div>
  </div>

  <div id="card-modal" class="card-modal" hidden>
    <div class="card-modal-inner">
      <div id="card-canvas-wrap" class="card-canvas-wrap"></div>
      <div class="card-modal-btns">
        <button id="download-btn" class="stamp-btn">📥 画像でダウンロード</button>
        <button id="close-modal-btn" class="sub-btn">とじる</button>
      </div>
      <p class="save-hint">うまく保存できないときは、画像を長押し(パソコンは右クリック)して保存してください</p>
    </div>
  </div>

  <script>
    'use strict';

    const $ = (id) => document.getElementById(id);
    const WEEKDAYS = ['日', '月', '火', '水', '木', '金', '土'];

    // Apps Script のサーバー関数を Promise で呼べるようにする
    function gs(fn, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler((e) => reject(new Error(e && e.message ? e.message : String(e))))
          [fn](...args);
      });
    }

    let state = null;
    const myName = () => localStorage.getItem('taiso-name') || '';

    async function fetchState() {
      try {
        state = await gs('getState');
        $('loading').hidden = true;
        $('main').hidden = false;
        render();
      } catch (e) {
        $('loading').textContent = '読み込みに失敗しました: ' + e.message;
        $('loading').hidden = false;
      }
    }

    function eventDates() {
      const dates = [];
      const d = new Date(state.startDate + 'T00:00:00Z');
      const end = new Date(state.endDate + 'T00:00:00Z');
      while (d <= end) {
        const iso = d.toISOString().slice(0, 10);
        dates.push({ iso, day: d.getUTCDate(), weekday: d.getUTCDay(), off: state.excludeWeekdays.includes(d.getUTCDay()) });
        d.setUTCDate(d.getUTCDate() + 1);
      }
      return dates;
    }

    function render() {
      $('event-name').textContent = state.eventName;
      document.title = state.eventName;

      const fmt = (iso) => `${Number(iso.slice(5, 7))}月${Number(iso.slice(8, 10))}日`;
      $('event-period').textContent = `${fmt(state.startDate)} 〜 ${fmt(state.endDate)} / 受付 ${state.windowStart}〜${state.windowEnd}`;

      const todayW = WEEKDAYS[new Date(state.today + 'T00:00:00Z').getUTCDay()];
      $('today-label').textContent = `${fmt(state.today)}(${todayW})`;
      $('now-clock').textContent = state.now;

      const winEl = $('window-label');
      if (state.open) {
        winEl.innerHTML = '<span class="open">🟢 ただいま受付中!</span> ボタンを押してスタンプをもらおう';
      } else {
        winEl.innerHTML = `<span class="closed">⏰ ${escapeHtml(state.closedReason)}</span>`;
      }

      $('stamp-btn').disabled = !state.open;

      $('name-list').innerHTML = state.participants
        .map((p) => `<option value="${escapeHtml(p.name)}">`).join('');
      if (!$('name-input').value && myName()) $('name-input').value = myName();

      $('rewards').innerHTML = state.rewards
        .map((r) => `<li>${r.days}日で ${escapeHtml(r.label)}</li>`).join('');

      renderBoard();
    }

    function renderBoard() {
      const dates = eventDates();
      const validDays = dates.filter((d) => !d.off).length;
      const todayCount = state.participants.filter((p) => p.stamps[state.today]).length;
      $('today-count').textContent = state.participants.length
        ? `今日の出席 ${todayCount}人 / 参加 ${state.participants.length}人`
        : 'まだ誰も登録していません。最初の1人になろう!';

      const sorted = [...state.participants].sort((a, b) => {
        if (a.name === myName()) return -1;
        if (b.name === myName()) return 1;
        return Object.keys(b.stamps).length - Object.keys(a.stamps).length || a.name.localeCompare(b.name, 'ja');
      });

      $('board').innerHTML = sorted.map((p) => {
        const total = Object.keys(p.stamps).length;
        const isMe = p.name === myName();
        const cells = dates.map((d) => {
          const t = p.stamps[d.iso];
          const cls = ['day', d.off ? 'off' : '', d.iso === state.today ? 'today' : '', t ? 'stamped' : ''].filter(Boolean).join(' ');
          const hanko = t ? `<span class="hanko">☀</span><span class="time">${escapeHtml(t)}</span>` : '';
          return `<div class="${cls}" title="${d.iso}${t ? ' ' + escapeHtml(t) : ''}"><span class="num">${d.day}</span>${hanko}</div>`;
        }).join('');
        const badges = state.rewards.map((r) => {
          const got = total >= r.days;
          return `<span class="${got ? '' : 'locked'}">${got ? '🎉' : '🔒'} ${escapeHtml(r.label)}</span>`;
        }).join('');
        return `
          <div class="taiso-card${isMe ? ' me' : ''}" data-name="${escapeHtml(p.name)}" title="クリックで拡大・画像保存">
            <div class="taiso-head">
              <span class="taiso-name">${escapeHtml(p.name)}${isMe ? '<span class="me-badge">あなた</span>' : ''}</span>
              <span class="taiso-total">${total} / ${validDays}日</span>
            </div>
            <div class="day-grid">${cells}</div>
            <div class="reward-badges">${badges}</div>
          </div>`;
      }).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (c) => (
        { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
      ));
    }

    function showMessage(text, ok) {
      const el = $('message');
      el.textContent = text;
      el.className = 'message ' + (ok ? 'ok' : 'err');
    }

    function playStampAnimation() {
      const overlay = $('stamp-overlay');
      overlay.hidden = false;
      setTimeout(() => { overlay.hidden = true; }, 1100);
    }

    $('stamp-btn').addEventListener('click', async () => {
      const name = $('name-input').value.trim();
      if (!name) return showMessage('お名前を入力してください', false);
      localStorage.setItem('taiso-name', name);

      $('stamp-btn').disabled = true;
      showMessage('スタンプを押しています…', true);
      try {
        const body = await gs('pushStamp', name);
        if (body.ok) {
          playStampAnimation();
          showMessage(`スタンプを押しました!(${body.time}) これで ${body.total}日目 🌻`, true);
        } else {
          showMessage(body.error || 'エラーが発生しました', false);
        }
      } catch (e) {
        showMessage('通信エラー: ' + e.message, false);
      }
      await fetchState();
    });

    $('stamp-overlay').addEventListener('click', () => { $('stamp-overlay').hidden = true; });

    // ---------- カードの拡大表示と画像ダウンロード ----------

    let modalName = '';
    let modalDataUrl = '';

    function renderCardCanvas(p) {
      const dates = eventDates();
      const validDays = dates.filter((d) => !d.off).length;
      const total = Object.keys(p.stamps).length;

      const cols = 7, cell = 96, gap = 8, padX = 40;
      const rows = Math.ceil(dates.length / cols);
      const W = padX * 2 + cols * cell + (cols - 1) * gap;
      const headH = 158;
      const gridH = rows * cell + (rows - 1) * gap;
      const gotRewards = state.rewards.filter((r) => total >= r.days);
      const badgeH = gotRewards.length ? 64 : 20;
      const H = headH + gridH + badgeH + 46;

      const canvas = document.createElement('canvas');
      canvas.width = W * 2; canvas.height = H * 2; // 高解像度で描画
      const ctx = canvas.getContext('2d');
      ctx.scale(2, 2);

      const FONT = '"Hiragino Maru Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif';

      ctx.fillStyle = '#fff8e7';
      ctx.beginPath(); ctx.roundRect(3, 3, W - 6, H - 6, 18); ctx.fill();
      ctx.strokeStyle = '#e0402f'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.roundRect(3, 3, W - 6, H - 6, 18); ctx.stroke();

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#e0402f'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.ellipse(W / 2, 26, 26, 11, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      ctx.fillStyle = '#4a6076';
      ctx.font = `bold 17px ${FONT}`;
      ctx.textAlign = 'center';
      ctx.fillText(state.eventName, W / 2, 66);
      ctx.font = `13px ${FONT}`;
      const fmt = (iso) => `${Number(iso.slice(5, 7))}月${Number(iso.slice(8, 10))}日`;
      ctx.fillText(`${fmt(state.startDate)} 〜 ${fmt(state.endDate)}`, W / 2, 88);

      ctx.textAlign = 'left';
      ctx.fillStyle = '#2b3a4a';
      ctx.font = `bold 30px ${FONT}`;
      ctx.fillText(`${p.name} さん`, padX, 130);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#e0402f';
      ctx.fillText(`${total} / ${validDays}日`, W - padX, 130);

      ctx.strokeStyle = '#e0402f'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.moveTo(padX, 142); ctx.lineTo(W - padX, 142); ctx.stroke();

      dates.forEach((d, i) => {
        const x = padX + (i % cols) * (cell + gap);
        const y = headH + Math.floor(i / cols) * (cell + gap);
        ctx.fillStyle = d.off ? '#eef2f5' : '#ffffff';
        ctx.strokeStyle = '#d9c9a8'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.roundRect(x, y, cell, cell, 10); ctx.fill(); ctx.stroke();

        ctx.fillStyle = d.off ? '#b8c4cd' : '#8a97a3';
        ctx.font = `bold 15px ${FONT}`;
        ctx.textAlign = 'left';
        ctx.fillText(String(d.day), x + 8, y + 20);

        const t = p.stamps[d.iso];
        if (t) {
          const cx = x + cell / 2, cy = y + cell / 2 + 4;
          ctx.save();
          ctx.translate(cx, cy); ctx.rotate(-0.14);
          ctx.strokeStyle = 'rgba(224, 64, 47, 0.9)'; ctx.lineWidth = 3.5;
          ctx.beginPath(); ctx.arc(0, 0, cell * 0.36, 0, Math.PI * 2); ctx.stroke();
          ctx.fillStyle = '#e0402f';
          ctx.font = `bold 30px ${FONT}`;
          ctx.textAlign = 'center';
          ctx.fillText('☀', 0, 11);
          ctx.restore();
          ctx.fillStyle = '#a52d20';
          ctx.font = `10px ${FONT}`;
          ctx.textAlign = 'center';
          ctx.fillText(t, cx, y + cell - 7);
        }
      });

      if (gotRewards.length) {
        let bx = padX;
        const by = headH + gridH + 22;
        ctx.font = `bold 15px ${FONT}`;
        ctx.textAlign = 'left';
        for (const r of gotRewards) {
          const label = `🎉 ${r.label}`;
          const w = ctx.measureText(label).width + 26;
          ctx.fillStyle = '#ffffff';
          ctx.strokeStyle = '#3d9b63'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.roundRect(bx, by, w, 32, 16); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#3d9b63';
          ctx.fillText(label, bx + 13, by + 22);
          bx += w + 10;
          if (bx > W - padX - 120) break;
        }
      }

      return canvas;
    }

    function openCardModal(name) {
      const p = state.participants.find((q) => q.name === name);
      if (!p) return;
      modalName = name;
      const canvas = renderCardCanvas(p);
      modalDataUrl = canvas.toDataURL('image/png');
      const img = document.createElement('img');
      img.src = modalDataUrl;
      img.alt = `${name} さんのスタンプカード`;
      const wrap = $('card-canvas-wrap');
      wrap.innerHTML = '';
      wrap.appendChild(img);
      $('card-modal').hidden = false;
    }

    $('board').addEventListener('click', (e) => {
      const card = e.target.closest('.taiso-card');
      if (card) openCardModal(card.dataset.name);
    });

    $('download-btn').addEventListener('click', () => {
      if (!modalDataUrl) return;
      const a = document.createElement('a');
      a.href = modalDataUrl;
      a.download = `ラジオ体操カード_${modalName}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    });

    $('close-modal-btn').addEventListener('click', () => { $('card-modal').hidden = true; });
    $('card-modal').addEventListener('click', (e) => {
      if (e.target === $('card-modal')) $('card-modal').hidden = true;
    });

    fetchState();
    // 60秒ごとに自動更新(みんなのスタンプが増えるのが見える)
    setInterval(fetchState, 60000 + Math.floor(Math.random() * 15000));
  </script>
</body>
</html>
